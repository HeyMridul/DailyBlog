<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — DailyLog</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="admin-shell">

    <!-- LOGIN VIEW -->
    <section id="loginView">
      <header class="site-header" style="padding:0 0 2rem;">
        <div class="site-header__eyebrow">daily-log / admin</div>
        <h1 style="font-size:1.8rem;">Admin login</h1>
      </header>

      <div class="admin-card">
        <form id="loginForm">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required />
          <p id="loginMsg" class="form-msg"></p>
          <button type="submit" class="btn">Log in</button>
        </form>
      </div>
    </section>

    <!-- DASHBOARD VIEW (hidden until logged in) -->
    <section id="dashboardView" style="display:none;">
      <div class="admin-topbar">
        <span>logged in as admin</span>
        <button id="logoutBtn" class="btn btn--ghost">Log out</button>
      </div>

      <div class="admin-card">
        <h2>New entry</h2>
        <form id="articleForm">
          <label for="title">Title</label>
          <input type="text" id="title" required />

          <label for="tag">Tag</label>
          <select id="tag">
            <option value="General">General</option>
            <option value="AI">AI</option>
            <option value="Web Dev">Web Dev</option>
            <option value="Deep Learning">Deep Learning</option>
            <option value="NLP">NLP</option>
            <option value="Tools">Tools</option>
            <option value="Opinion">Opinion</option>
            <option value="News">News</option>
          </select>

          <label for="content">Content</label>
          <textarea id="content" placeholder="Write your article. Leave a blank line between paragraphs." required></textarea>

          <p id="articleMsg" class="form-msg"></p>
          <button type="submit" class="btn">Publish entry</button>
        </form>
      </div>

      <div class="admin-card">
        <h2>Manage entries</h2>
        <ul id="manageList" class="manage-list"></ul>
      </div>

      <nav class="site-nav"><a href="index.html">← view public site</a></nav>
    </section>

  </div>

  <script src="js/admin.js"></script>
</body>
</html>
